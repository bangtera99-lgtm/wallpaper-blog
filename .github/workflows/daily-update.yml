name: Daily Wallpaper Update

# Menambah 6 wallpaper baru setiap hari dari data/pool.json,
# lalu me-render ulang index, halaman kategori, sitemap, dan RSS.
# Berjalan otomatis — tidak perlu dibuka manual.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC setiap hari (08:00 WIB)
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tambah 6 wallpaper + render ulang situs
        run: python scripts/generate.py --daily

      - name: Commit dan push jika ada perubahan
        run: |
          git config user.name "wallpaper-bot"
          git config user.email "wallpaper-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: tambah 6 wallpaper baru [auto]" || echo "Tidak ada perubahan"
          git push
